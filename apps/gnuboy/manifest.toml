# Game Boy emulator (why2025-linux sdapps/gnuboy). Fixed paths of the
# hand-installed app became placeholders: ROMs and saves live in the app's
# data folder on the card (%D), not in /mnt/sd/roms.
format = 1
id = "gnuboy"
name = "Game Boy"
version = "1.4.0"
build = 7
summary = "Game Boy and Game Boy Color emulator"
description = """
Plays Game Boy and Game Boy Color games, scaled to the panel's whole
width (720x648). The emulation runs at full speed; fewer frames are shown
while the whole screen scrolls. The sound plays on the output chosen in
Settings > Sound.

Put your .gb and .gbc files in the roms folder of this app: on the SD card
in badge/appdata/gnuboy/roms. Battery saves go to roms/saves.

Keys: arrows are the D-pad, square or Enter is A, triangle or Backspace
is B, cross or X is Start, circle or O is Select. Esc pauses: save or load
the state there (saving over a state asks first and keeps a backup), or
quit. Diamond shows the keys."""
author = "gnuboy authors (rofl0r/gnuboy), badge port"
license = "GPL-2.0-or-later AND MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
license_file = "gnuboy.txt"
homepage = "https://github.com/rofl0r/gnuboy"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/gnuboy/source"
upstream_version = "git c367bb4"
changelog = "The Game Boy's sound plays on the output chosen in Settings > Sound; the picture fills the screen's width, and saving a state over another asks first and keeps a backup. Uses the whole screen; hold the logo key to see WhyOS's status bar."

type = "game"
category = "emulators"
tags = ["emulator", "gameboy", "retro"]
install_location = "sd"

[launch]
statusbar = "hidden"        # draws in the status bar's rows: the whole screen
exec = "gnuboy"
args = "--source %d/badge.rc --savedir=%D/roms/saves %f"
info = "gnuboy"
icon = "gameboy"
files = "%D/roms"
types = ["gb", "gbc"]
stack_kb = 64

[requires]
os_api = 1
memory_kb = 1000          # estimate, not measured
features = ["sd-card", "display", "keyboard"]

[storage.data]
folders = ["roms", "roms/saves"]
user_folders = ["roms"]

[[bundled]]
name = "bsound (the badge's game sound)"
version = "WhyOS 3ef5aae"
license = "MIT"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/gnuboy/source"
license_file = "bsound.txt"

[[bundled]]
name = "tinyalsa"
version = "2.0.0"
license = "BSD-3-Clause"
source = "https://github.com/tinyalsa/tinyalsa/archive/v2.0.0/tinyalsa-2.0.0.tar.gz"
license_file = "tinyalsa.txt"

[[bundled]]
name = "uClibc-ng"
version = "1.0.57"
license = "LGPL-2.1-or-later"
source = "https://downloads.uclibc-ng.org/releases/1.0.57/"
license_file = "uClibc-ng.txt"

[[bundled]]
name = "JetBrains Mono (font)"
version = "2.211"
license = "OFL-1.1"
source = "https://github.com/JetBrains/JetBrainsMono"
license_file = "jetbrains-mono.txt"

[[bundled]]
name = "Space Grotesk (font)"
version = "2.000"
license = "OFL-1.1"
source = "https://github.com/floriankarsten/space-grotesk"
license_file = "space-grotesk.txt"
