# Links text browser (why2025-linux sdapps/links), in the menu's terminal
# window and as the "links" command in any shell. Its settings, bookmarks
# and history (~/.links2) go to the app's config directory.
format = 1
id = "links"
name = "Links"
version = "1.0.0"
build = 1
summary = "Text web browser with HTTPS, for the terminal"
description = """
A fast text-mode web browser. From the menu it opens in a terminal window
on its start page, and Files opens web pages with it. In a shell (serial
console or SSH), "links <address>" runs it in your own terminal.

HTTPS goes through OpenSSL with Mozilla's list of certificate
authorities. Links keeps small caches so it fits in the badge's memory
next to other programs."""
author = "Twibright Labs (Links), badge port"
license = "GPL-2.0-or-later AND Apache-2.0 AND Zlib AND LGPL-2.1-or-later AND MPL-2.0 AND MIT"
license_file = "links.txt"
homepage = "http://links.twibright.com"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/links/source"
upstream_version = "2.30"
changelog = "First store release. Also available as the links command in a shell."

type = "app"
category = "internet"
tags = ["browser", "web", "text", "terminal"]
permissions = ["network"]
install_location = "sd"

[launch]
exec = "start"
args = "%f"
info = "web browser (text)"
icon = "globe"
terminal = "close"
opens = ["html", "htm", "xhtml"]

[[commands]]
name = "links"
exec = "start"

[requires]
os_api = 1
memory_kb = 4000          # estimate, not measured
features = ["wifi", "sd-card", "keyboard"]

[storage.config]
max_kb = 64               # settings, bookmarks, history

[[bundled]]
name = "OpenSSL"
version = "3.5.6"
license = "Apache-2.0"
source = "https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz"
license_file = "openssl.txt"

[[bundled]]
name = "zlib"
version = "1.3.2"
license = "Zlib"
source = "https://zlib.net/fossils/zlib-1.3.2.tar.gz"
license_file = "zlib.txt"

[[bundled]]
name = "uClibc-ng"
version = "1.0.57"
license = "LGPL-2.1-or-later"
source = "https://downloads.uclibc-ng.org/releases/1.0.57/"
license_file = "uClibc-ng.txt"

[[bundled]]
name = "Mozilla CA certificate store (curl.se cacert.pem)"
version = "2026-09-25"
license = "MPL-2.0"
source = "https://curl.se/docs/caextract.html"
license_file = "ca-certificates.txt"

[[bundled]]
name = "Badge port (no-fork wrapper, start script and page)"
version = "2be6d7c"
license = "MIT"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps"
license_file = "badge-port.txt"
