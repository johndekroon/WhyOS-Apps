# Marble Orbit, written for the badge; its source is in source/.
format = 1
id = "marble"
name = "Marble Orbit"
version = "1.1.0"
build = 2
summary = "Tilt the badge to roll a marble into the ring"
description = """
Tilt the badge to roll a marble through a level and into the glowing ring.
There are 18 levels in six worlds: a wooden workshop, a desert, ice, a
temple, a factory and outer space. Each world adds something new: sand
that slows you down, ramps to jump gaps, ice and ice that cracks behind
you, currents, buttons that open gates, conveyor belts, bumpers, magnets,
lasers, low gravity, teleporters and a black hole.

You have three lives per level; falling into a hole costs one. Collect
the stars and finish quickly for a higher score. Levels unlock one by one,
and your best score per level is kept on the badge.

Esc pauses, the diamond shows the keys, the circle shows your results
and the cloud opens the settings: tilt or arrow keys, sensitivity, and
whether the badge counts as level when held as you start or when lying
flat. The screen stays upright while you play."""
author = "WhyOS-Apps contributors"
license = "MIT AND OFL-1.1 AND LGPL-2.1-or-later"
license_file = "marble.txt"
homepage = "https://github.com/johndekroon/WhyOS-Apps"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/marble/source"
changelog = "The new WhyOS look: the title on the frontpanel's figures, flat tiles and cards, frosted pop-ups with their keys inside; the title and pop-ups redraw only what changed."

type = "game"
category = "puzzle"
tags = ["marble", "tilt", "maze", "accelerometer"]
install_location = "sd"

[launch]
exec = "marble"
info = "tilt to roll into the ring"
icon = "games"
rotation = "locked"
stack_kb = 16

[requires]
os_api = 1
memory_kb = 600           # the 0.45 MB program with its tile cache (no heap); measured pool use not yet
features = ["display", "keyboard", "accelerometer"]

[[bundled]]
name = "uClibc-ng"
version = "1.0.57"
license = "LGPL-2.1-or-later"
source = "https://downloads.uclibc-ng.org/releases/1.0.57/"
license_file = "uClibc-ng.txt"

[[bundled]]
name = "JetBrains Mono (font)"
version = "2.211"
license = "OFL-1.1"
source = "https://github.com/JetBrains/JetBrainsMono"
license_file = "jetbrains-mono.txt"

[[bundled]]
name = "Space Grotesk (font)"
version = "2.000"
license = "OFL-1.1"
source = "https://github.com/floriankarsten/space-grotesk"
license_file = "space-grotesk.txt"
