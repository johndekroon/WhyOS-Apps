# MicroPython 1.29.0 (why2025-linux sdapps/micropython), the Python REPL in
# the menu's terminal window, and the "micropython" and "python" commands
# in any shell. Files runs a .py file with it (Open with).
# Package 1.29.1 (build 2) is MicroPython 1.29.0 (upstream_version) with
# meshcore_py and our setting, ics and xml modules frozen in; 1.29.3 adds
# the WhyOS SDK as the module whyos.
format = 1
id = "micropython"
name = "MicroPython"
version = "1.29.3"
build = 4
summary = "Python 3 on the badge: an interactive prompt and your own scripts"
description = """
MicroPython is a lean implementation of Python 3. From the menu it opens
the interactive prompt (the REPL): type Python and see the result at
once, with history (arrow keys), Tab completion and automatic
indentation. Ctrl+D closes it, Ctrl+E pastes a block of code. In a shell
(serial console or SSH) "micropython" or "python" starts the prompt in
your own terminal, and "python script.py" runs a script.

Put your scripts in badge/appdata/micropython on the SD card: the prompt
starts there, so "import myscript" runs myscript.py. Files also runs a
.py file under Open with, and leaves the prompt open afterwards. Modules
in the lib folder there can be imported from anywhere, and
"python -m mip install <package>" installs packages from micropython-lib
into it (Wi-Fi needed).

Included: json, re, socket and ssl (HTTPS), requests, asyncio,
hashlib, time, os, math, struct, binascii, deflate, select and more, and
the @micropython.native and viper decorators for fast code. For the
badge: meshcore (MeshCore messages and bots over LoRa, with an example
bot), setting (the badge's settings), ics (calendars from an .ics link,
repeats worked out), xml.etree.ElementTree (XML as in CPython), and whyos:
the WhyOS SDK, so a script can have the badge's own screens (lists,
forms, a typed line, a text editor, one colour, dialogs) with the key bar,
help, log and settings every app has. Not
included: threads, ffi, and CPython's larger standard library. The heap
is 2 MB; MICROPY_HEAP=4M before the command gives a script more."""
author = "Damien P. George and the MicroPython contributors, badge port"
license = "MIT AND (Apache-2.0 OR GPL-2.0-or-later) AND BSD-3-Clause AND Zlib AND OFL-1.1 AND LGPL-2.1-or-later"
license_file = "micropython.txt"
homepage = "https://micropython.org"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/micropython/source"
upstream_version = "1.29.0"
changelog = "The module whyos: the WhyOS SDK in Python, for scripts with the badge's own screens (sdk/python/README.md in WhyOS). A script that asks for more memory than the heap has fails with MemoryError instead of ending MicroPython."

type = "app"
category = "development"
tags = ["python", "micropython", "programming", "repl", "scripting", "terminal"]
install_location = "sd"

permissions = ["system"]

[launch]
exec = "start"
args = "--menu %f"
info = "Python 3 interpreter"
icon = "terminal"
terminal = "close"
opens_also = ["py"]

[[commands]]
name = "micropython"
exec = "start"

[[commands]]
name = "python"
exec = "start"

[requires]
os_api = 1
memory_kb = 3400          # the 1.14 MB program (0.86 MB before the whyos module) and its 2 MB heap (derived)
features = ["sd-card", "keyboard"]

[storage.data]
folders = ["lib"]

