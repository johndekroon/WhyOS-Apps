# MicroPython as a badge app (docs/APPS.md, sdapps/README.md): the REPL in
# appterm's window. Files runs a .py file with it under Open with; the
# REPL stays open after the script (the start script).
NAME="MicroPython"
INFO="Python 3 interpreter"
CATEGORY=apps
ICON=terminal
EXEC=start
ARGS="--menu %f"
TERMINAL=close
OPENS_ALSO="py"
