# nano as a badge app (docs/APPS.md, sdapps/README.md): the text editor in
# appterm's window. Files opens text files with it; from the menu it
# starts on a new file on the card (the start script).
NAME="nano"
INFO="text editor"
CATEGORY=apps
ICON=keyboard
EXEC=start
TERMINAL=close
OPENS="txt md conf cfg ini sh py c h json toml yaml yml csv log"
ARGS="%f"
