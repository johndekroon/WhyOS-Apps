# NetSurf web browser (why2025-linux sdapps/netsurf). The start script
# (overlay/start) points HOME at the app's config directory, so cookies
# and history no longer go to /root/.netsurf.
format = 1
id = "netsurf"
name = "NetSurf"
version = "1.1.0"
build = 2
summary = "Graphical web browser with HTTPS, without JavaScript"
description = """
A web browser with its own layout engine: HTML, CSS, PNG, JPEG and GIF,
HTTPS through Mbed TLS. No JavaScript, WebP, SVG or video, to save memory.

The badge has no mouse, so the browser brings a pointer: the arrows move
it (faster while held), circle clicks or drags, triangle and cross scroll
a page up and down, square and diamond go back and forward, and the cloud
key opens the address bar. Fn with the arrows sends the arrow keys
themselves.

Large pages such as Wikipedia do not fit in the badge's memory; NetSurf
then stops with an error instead of hanging."""
author = "NetSurf developers, badge port"
license = "GPL-2.0-only AND MIT AND Unicode-DFS-2015 AND (Apache-2.0 OR GPL-2.0-or-later) AND curl AND libpng-2.0 AND IJG AND Zlib AND LGPL-2.1-or-later AND MPL-2.0"
license_file = "netsurf.txt"
homepage = "https://www.netsurf-browser.org"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/netsurf/source"
upstream_version = "3.11"
changelog = "Esc opens a pause screen: resume, the keys, quit. ◆ shows the keys."

type = "app"
category = "internet"
tags = ["browser", "web", "https"]
permissions = ["network"]
install_location = "sd"

[launch]
exec = "start"
args = "-f badge -w 720 -h 720 -b 16 %u"
info = "web browser"
icon = "globe"
opens = ["html", "htm", "xhtml", "svg"]
stack_kb = 256

[requires]
os_api = 1
memory_kb = 5000          # about 5 MB of the pool for ordinary pages (sdapps/README.md)
features = ["wifi", "sd-card", "display", "keyboard"]

[storage.config]
max_kb = 128              # cookies and history

