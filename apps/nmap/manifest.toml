# nmap (why2025-linux sdapps/nmap): a command-line app, in the menu's
# terminal window with a shell after it, and the "nmap" command in any shell.
format = 1
id = "nmap"
name = "nmap"
version = "1.0.0"
build = 1
summary = "Network scanner (TCP connect scans)"
description = """
Scans hosts and ports on the network the badge is connected to.

Only TCP connect scans work (--unprivileged is always added): raw packets
need a memory-mapped packet ring, which the badge's kernel cannot give.
No scripts (NSE). From the menu, nmap shows its help and leaves a shell
in which "nmap <target>" scans; in a shell over SSH or the serial
console the nmap command works the same way."""
author = "Nmap Project, badge port"
license = "LicenseRef-NPSL-0.95 AND BSD-3-Clause AND (BSD-3-Clause WITH PCRE2-exception) AND LGPL-2.1-or-later AND MIT"
license_file = "nmap.txt"
homepage = "https://nmap.org"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/nmap/source"
upstream_version = "7.95"
changelog = "First store release."

type = "app"
category = "network"
tags = ["scanner", "network", "security", "ports"]
permissions = ["network"]
install_location = "sd"

[launch]
exec = "nmap"
args = "--datadir %d/share --unprivileged --nsock-engine poll"
info = "network scanner"
icon = "globe"
terminal = "shell"

[[commands]]
name = "nmap"
exec = "nmap"
args = "--datadir %d/share --unprivileged --nsock-engine poll"

[requires]
os_api = 1
memory_kb = 7000          # 7 of 13 MB for a one-port scan (Docs/16-linux.md)
features = ["wifi", "sd-card"]

[[bundled]]
name = "libpcap"
version = "1.10.4 (in nmap 7.95)"
license = "BSD-3-Clause"
source = "https://nmap.org/dist/nmap-7.95.tar.bz2"
license_file = "libpcap.txt"

[[bundled]]
name = "libdnet (nmap libdnet-stripped)"
version = "nmap 7.95"
license = "BSD-3-Clause"
source = "https://nmap.org/dist/nmap-7.95.tar.bz2"
license_file = "libdnet.txt"

[[bundled]]
name = "LIBLINEAR"
version = "2.47 (in nmap 7.95)"
license = "BSD-3-Clause"
source = "https://nmap.org/dist/nmap-7.95.tar.bz2"
license_file = "liblinear.txt"

[[bundled]]
name = "PCRE2"
version = "10.43 (in nmap 7.95)"
license = "BSD-3-Clause WITH PCRE2-exception"
source = "https://nmap.org/dist/nmap-7.95.tar.bz2"
license_file = "pcre2.txt"

[[bundled]]
name = "uClibc-ng"
version = "1.0.57"
license = "LGPL-2.1-or-later"
source = "https://downloads.uclibc-ng.org/releases/1.0.57/"
license_file = "uClibc-ng.txt"

[[bundled]]
name = "Badge port (fast exit)"
version = "2be6d7c"
license = "MIT"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps"
license_file = "badge-port.txt"
