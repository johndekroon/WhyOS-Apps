# PDF viewer (why2025-linux sdapps/pdfview). Not in the menu's lists:
# Files opens PDF files with it.
format = 1
id = "pdfview"
name = "PDF viewer"
version = "1.0.0"
build = 1
summary = "Shows PDF documents, opened from Files"
description = """
Reads PDF documents on the badge: a page as wide as the screen, to
scroll with the arrow keys, on into the next page. Left and Right turn
the pages, Space goes a screen down, Enter zooms in 2x. The square key
has Go to page and Whole page. It opens a file again on the page you
left it at.

Files opens PDF files with it; it has no entry in the menu's lists.
Rendering is done by MuPDF, cut down for the badge: documents in Chinese,
Japanese or Korean, and PDFs with JPEG 2000 images, show those parts as
boxes or blank. Locked PDFs (with a password) cannot be opened.

It needs about 6 MB of memory while it shows a page."""
author = "badge port"
license = "AGPL-3.0-or-later AND FTL AND IJG AND Zlib AND OFL-1.1 AND LGPL-2.1-or-later"
license_file = "pdfview.txt"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/pdfview/source"
changelog = "First version."

type = "app"
category = "media"
tags = ["pdf", "documents", "viewer", "reader"]
install_location = "sd"

[launch]
exec = "pdfview"
args = "%f"
opens = ["pdf"]
menu = "none"
stack_kb = 256

[requires]
os_api = 1
memory_kb = 7000          # the 3.2 MB program and 256 KB stack, a page of 1.6 MB, MuPDF's store of 1.5 MB; 5.7 MB measured on a page of text
features = ["display", "keyboard"]

