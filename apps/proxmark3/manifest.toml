# Proxmark3 (Repos/proxmark3, branch badge): the RRG/Iceman client built
# with BADGE=1. From the menu it shows its own screens (pm3 --ui, drawn
# with why2025-linux's libwb: client/src/badgeui/); the pm3 and proxmark3
# commands give its command line in any shell.
format = 1
id = "proxmark3"
name = "Proxmark3"
version = "1.1.1"
build = 3
summary = "Proxmark3 client: read, write and sniff RFID and NFC cards from the badge"
description = """
The Proxmark3 client (RRG/Iceman) on the badge itself, for a Proxmark3
on the bottom USB port: work with LF and HF cards from the badge's
keyboard, without a laptop. Tested with a Proxmark3 RDV4.

From the menu it opens on its own screens: search for a card, check the
keys of a MIFARE Classic sector by sector and dump it, keep the cards you
saved with their dumps and keys (also the dumps the client saves itself,
such as iCLASS and Ultralight), edit a saved dump in Write, choose the key
lists to try (and edit your own in Write), sniff a reader and a card, and
the client's command line on the screen (Console).

The Proxmark3 needs RRG/Iceman firmware of the same release as this
client (v4.21611); flash it from a computer.

This is a smaller build than the client on a computer, to fit in the
badge's memory. Left out: Lua and Python scripts, and MIFARE Classic key
recovery that runs in the client (nested, darkside, hardnested). Key
checks that run on the Proxmark3 itself (hf mf chk, hf mf fchk) work,
with the default key lists included. The arrow keys recall earlier
commands and move the cursor; Tab does not complete.

The app connects to the Proxmark3 by itself, also when it is plugged in
later. Dumps, key files and traces go to /root/.proxmark3/dumps, in the
badge's flash; your key lists to /root/.proxmark3/dictionaries. In a
shell over SSH or the serial console, pm3 (or proxmark3) starts the
client's command line."""
author = "RRG/Iceman Proxmark3 contributors, badge build"
license = "GPL-3.0-or-later AND Apache-2.0 AND MIT AND BSD-3-Clause AND LGPL-2.1-or-later AND OFL-1.1"
license_file = "proxmark3.txt"
homepage = "https://github.com/RfidResearchGroup/proxmark3"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/proxmark3/source"
upstream_version = "4.21611-636 (da509461b)"
changelog = "A saved card's options can load its dump into the Proxmark3 (before only on the triangle); a saved card with an iCLASS dump always counts as iCLASS, so loading, Simulate and Write are there."

type = "app"
category = "hardware"
tags = ["rfid", "nfc", "proxmark", "mifare", "security"]
permissions = ["usb", "files-all"]   # files-all: it saves in /root/.proxmark3
install_location = "sd"

[launch]
exec = "pm3"
args = "--ui"
info = "RFID and NFC cards"
icon = "usb"

[[commands]]
name = "pm3"
exec = "pm3"

[[commands]]
name = "proxmark3"
exec = "pm3"

[requires]
os_api = 1
memory_kb = 10000         # ≈ 5 MB at the prompt, ≈ 9.8 MB during hf search (Docs/08-usb.md 8.5)
features = ["usb-host", "sd-card", "keyboard"]   # sd-card: the app itself is on the card

