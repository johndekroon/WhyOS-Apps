# The app store itself (client/), in flash so it works without a card.
# It updates itself like any app (docs/client.md §2): on NOMMU the running
# program is in RAM, so its file can be replaced under it.
format = 1
id = "store"
name = "App store"
version = "0.2.11"
build = 12
summary = "Find, install and update apps and games"
description = """
The WhyOS app store: browse and search the apps and games, install them on
the SD card, update them, and see what is on your badge. It opens from
Apps > App store and Settings > My apps; "store" in a shell does the same
from the command line (store --help).

It fetches the store's index over HTTPS and checks every package against
it before anything is installed."""
author = "WhyOS-Apps"
license = "MIT AND (Apache-2.0 OR GPL-2.0-or-later) AND Zlib AND LGPL-2.1-or-later AND OFL-1.1"
license_file = "store.txt"
homepage = "https://github.com/johndekroon/WhyOS-Apps"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/client"
changelog = "Apps whose start script runs another program (MicroPython, nano, Links, NetSurf, NetHack, DOOM) run again from an f2fs card; the store repairs apps it installed before at the next start."

type = "system"
category = "store"
tags = ["store", "apps", "packages"]
permissions = ["network"]
install_location = "flash"

[launch]
exec = "store"
info = "install apps and games"
icon = "store"

[[commands]]
name = "store"
exec = "store"

[requires]
os_api = 1
memory_kb = 1536
features = ["wifi", "display", "keyboard"]

