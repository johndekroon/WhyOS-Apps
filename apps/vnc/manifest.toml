# The VNC server (WhyOS sdapps/vnc), written for the badge.
format = 1
id = "vnc"
name = "VNC server"
version = "1.1.0"
build = 2
summary = "The badge's screen and keys on a computer, over Wi-Fi or USB."
description = """
A VNC server: a viewer on a computer (macOS's Screen Sharing, TigerVNC,
RealVNC and others) shows the badge's screen and types on its keys. It
is a service, without a tile: turn it on in Settings > Connection > VNC
server, where you also find the addresses to connect to (Wi-Fi, and
192.168.4.1 over the USB cable) and the password, with a button for a
new one. It starts again after a restart.

It needs full access to the badge, as anyone who has the password
controls it. The session is not encrypted: use it on your own network or
the cable. There is no pointer, only the keys."""
author = "WhyOS-Apps contributors"
license = "MIT AND Apache-2.0 AND LGPL-2.1-or-later AND Zlib"
license_file = "vnc.txt"
homepage = "https://github.com/johndekroon/WhyOS-Apps"
source = "https://github.com/johndekroon/WhyOS-Apps/tree/main/apps/vnc/source"
changelog = "A service without a tile: its page in Settings > Connection. ZRLE, so it is quick over USB and Wi-Fi, and macOS's Screen Sharing works."
permissions = ["daemon"]

type = "app"
category = "internet"
tags = ["vnc", "remote", "screen-sharing"]
install_location = "flash"

[service]
exec = "vncd"
section = "connection"
port = 5900
show = [{ label = "Password", file = "password" }]
actions = [{ label = "New password", run = "vncd -n" }]

[requires]
os_api = 1
memory_kb = 1500          # estimate: the 0.16 MB program, its 1 MB frame and ZRLE's 0.3 MB while a viewer is connected
features = ["wifi", "display", "keyboard"]

[[bundled]]
name = "uClibc-ng"
version = "1.0.57"
license = "LGPL-2.1-or-later"
source = "https://downloads.uclibc-ng.org/releases/1.0.57/"
license_file = "uClibc-ng.txt"

[[bundled]]
name = "Mbed TLS (DES only)"
version = "3.6.6"
license = "Apache-2.0"
source = "https://github.com/Mbed-TLS/mbedtls/releases/tag/mbedtls-3.6.6"
license_file = "mbedtls.txt"

[[bundled]]
name = "zlib"
version = "1.3.2"
license = "Zlib"
source = "https://zlib.net/fossils/zlib-1.3.2.tar.gz"
license_file = "zlib.txt"
