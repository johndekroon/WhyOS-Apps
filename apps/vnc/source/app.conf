# The VNC server as a service (docs/APPS.md "Services", sdapps/README.md):
# no tile; vncd runs as root while Settings > Connection > VNC server is on,
# and that page shows where to connect and the password.
NAME="VNC server"
ICON=wifi
SERVICE=vncd
SERVICE_PORT=5900
SERVICE_SHOW="Password|password"
SERVICE_ACTION="New password|vncd -n"
PERMISSIONS="daemon"
