# The VNC server as a badge app (sdapps/README.md): vncd, the service, runs
# as root while Settings > Connection > VNC server is on; the app shows
# where to connect and the password, in appterm's window.
NAME="VNC server"
INFO="screen and keys over the network"
CATEGORY=tools
ICON=wifi
EXEC=info
TERMINAL=1
SERVICE=vncd
PERMISSIONS="system"
