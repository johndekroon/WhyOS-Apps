# apps/gnuboy/manifest.toml: the Game Boy emulator, repackaged for the store.
# Compare with why2025-linux sdapps/gnuboy/app.conf: the fixed /mnt/sd/roms
# paths became %D (the app's data directory on the card).
# Version, build and memory figures are illustrative, not measured.

format = 1
id = "gnuboy"
name = "Game Boy"
version = "1.0.4"
build = 5
summary = "Game Boy and Game Boy Color emulator"
description = """
Plays Game Boy and Game Boy Color games at full speed, scaled 4x to the
middle of the panel. No sound.

Put your .gb and .gbc files in the "roms" folder of this app (Files >
SD card > badge > appdata > gnuboy > roms). Battery saves go to
roms/saves. Square saves a state, triangle loads it, Esc quits."""
author = "gnuboy authors"
license = "GPL-2.0-or-later"
homepage = "https://github.com/rofl0r/gnuboy"
source = "https://github.com/rofl0r/gnuboy"
upstream_version = "1.0.4"
changelog = "First store release."

type = "game"
category = "emulators"
tags = ["emulator", "gameboy", "retro"]

install_location = "sd"

[launch]
exec = "gnuboy"
args = "--source %d/badge.rc --savedir=%D/roms/saves %f"
info = "gnuboy"
icon = "gameboy"
files = "%D/roms"
types = ["gb", "gbc"]
opens = ["gb", "gbc"]
stack_kb = 64

[requires]
os_api = 1
memory_kb = 1200
features = ["sd-card", "display", "keyboard"]

[storage.config]
max_kb = 4

[storage.data]
max_mb = 0
folders = ["roms", "roms/saves"]
user_folders = ["roms"]

[storage.cache]
enabled = false
