# apps/nmap/manifest.toml: a command-line app. Compare with why2025-linux
# sdapps/nmap/app.conf. From the menu it runs in the terminal window with a
# shell after it; [[commands]] also makes "nmap" work in any shell (SSH,
# serial console). Version, build and memory figures are illustrative.

format = 1
id = "nmap"
name = "nmap"
version = "7.95.0"
build = 1
summary = "Network scanner (connect scans only)"
description = """
Scans hosts and ports on the network the badge is connected to.

Only TCP connect scans work: raw packets need a memory-mapped packet ring
that the badge's kernel cannot provide. From the menu, nmap starts with
its help and leaves a shell in which you type "nmap <target>"."""
author = "Nmap Project"
license = "LicenseRef-NPSL-0.95"
homepage = "https://nmap.org"
source = "https://nmap.org/dist/"
upstream_version = "7.95"

type = "app"
category = "network"
tags = ["scanner", "network", "security"]
permissions = ["network"]

[launch]
exec = "nmap"
args = "--datadir %d/share --unprivileged --nsock-engine poll"
info = "network scanner"
icon = "globe"
terminal = "shell"

[[commands]]
name = "nmap"
exec = "nmap"
args = "--datadir %d/share --unprivileged --nsock-engine poll"

[requires]
os_api = 1
memory_kb = 7000
features = ["wifi", "sd-card"]

[storage.config]
max_kb = 0
